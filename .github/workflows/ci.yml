name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
          components: rustfmt, clippy

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Format
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test (every page, the tutorial, and probes that a changed cell is caught)
        run: cargo test --release

      - name: Browser playground (the wasm build, in node, against the native one)
        run: |
          node web/build.mjs
          node web/test.mjs

      - name: VS Code extension (grammar, language server, run)
        working-directory: editors/vscode
        run: |
          npm ci
          npm run build
          npm test

  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build the theorems (formal/)
        working-directory: formal
        run: lake build

      - name: No sorry, no added axioms
        working-directory: formal
        run: |
          ! grep -rnw --include='*.lean' -e sorry -e admit -e axiom Babbage
          cat > /tmp/Axioms.lean <<'LEAN'
          import Babbage
          #print axioms Babbage.no_tetration
          #print axioms Babbage.tower_halts
          #print axioms Babbage.halting_dichotomy
          #print axioms Babbage.no_pentation
          #print axioms Babbage.no_tetration_eventually
          #print axioms Babbage.Minsky.compile_halts
          #print axioms Babbage.Minsky.machine_halts_of_compile
          #print axioms Babbage.Minsky.compile_refused
          #print axioms Babbage.Minsky.trap_halts
          #print axioms Babbage.Minsky.machine_halts_of_trap
          #print axioms Babbage.Minsky.trap37_halts
          #print axioms Babbage.Minsky.machine_halts_of_trap37
          #print axioms Babbage.Minsky.trapDeck_accepted
          #print axioms Babbage.Minsky.trapDeck37_accepted
          #print axioms Babbage.no_tetration_reach
          #print axioms Babbage.no_pentation_reach
          LEAN
          lake env lean /tmp/Axioms.lean | tee /tmp/axioms.txt
          ! grep -v -E "\[propext, (Classical.choice, )?Quot.sound\]" /tmp/axioms.txt | grep -q .

      - name: Lean against Rust (the same decks run by Babbage.step and by src/sketch.rs)
        run: scripts/lean-diff.sh 2000
