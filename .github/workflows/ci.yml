name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
          components: rustfmt, clippy

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Format
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test (every page, the tutorial, and probes that a changed cell is caught)
        run: cargo test --release

      - name: Browser playground (the wasm build, in node, against the native one)
        run: |
          node web/build.mjs
          node web/test.mjs

      - name: VS Code extension (grammar, language server, run)
        working-directory: editors/vscode
        run: |
          npm ci
          npm run build
          npm test

  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build the theorems (formal/)
        working-directory: formal
        run: lake build

      - name: No sorry, no added axioms
        working-directory: formal
        run: |
          ! grep -rnw --include='*.lean' -e sorry -e admit -e axiom Babbage
          cat > /tmp/Axioms.lean <<'LEAN'
          import Babbage
          #print axioms Babbage.no_tetration
          #print axioms Babbage.tower_halts
          #print axioms Babbage.halting_dichotomy
          #print axioms Babbage.no_pentation
          #print axioms Babbage.no_tetration_eventually
          #print axioms Babbage.Minsky.compile_halts
          #print axioms Babbage.Minsky.machine_halts_of_compile
          #print axioms Babbage.Minsky.compile_refused
          #print axioms Babbage.Minsky.trap_halts
          #print axioms Babbage.Minsky.machine_halts_of_trap
          #print axioms Babbage.Minsky.trap37_halts
          #print axioms Babbage.Minsky.machine_halts_of_trap37
          #print axioms Babbage.Minsky.trapDeck_accepted
          #print axioms Babbage.Minsky.trapDeck37_accepted
          #print axioms Babbage.Minsky.trapDeck_constReps
          #print axioms Babbage.Minsky.halts43
          #print axioms Babbage.Minsky.machine_halts_of_43
          #print axioms Babbage.Minsky.deck43_plain
          #print axioms Babbage.Minsky.deck43_accepted
          #print axioms Babbage.Minsky.deck43_refused
          #print axioms Babbage.step43_lift
          #print axioms Babbage.Minsky.haltsB
          #print axioms Babbage.Minsky.machine_halts_of_B
          #print axioms Babbage.Minsky.deckB_plain
          #print axioms Babbage.Minsky.deckB_accepted
          #print axioms Babbage.Minsky.deckB_refused
          #print axioms Babbage.run_expand
          #print axioms Babbage.no_tetration_reach
          #print axioms Babbage.no_pentation_reach
          #print axioms Babbage.halt_within_1837
          #print axioms Babbage.no_triple_exp_1837
          #print axioms Babbage.no_tet_exp_1837
          #print axioms Babbage.triple_halts_1838
          #print axioms Babbage.tet_exp_halts_1838
          #print axioms Babbage.Mill.give_off_retain
          #print axioms Babbage.Mill.add_band
          #print axioms Babbage.Mill.step_band
          #print axioms Babbage.Mill.step_multiplier
          #print axioms Babbage.Mill.countDown_spec
          #print axioms Babbage.Mill.add_loop
          #print axioms Babbage.Mill.multiply_correct
          #print axioms Babbage.Mill.multiply_invariant
          #print axioms Babbage.Mill.multiply_lists
          LEAN
          lake env lean /tmp/Axioms.lean | tee /tmp/axioms.txt
          # every theorem printed, and each depends only on standard axioms
          test "$(grep -c 'depends on axioms\|does not depend on any axioms' /tmp/axioms.txt)" -eq "$(grep -c '^#print axioms' /tmp/Axioms.lean)"
          ! grep 'depends on axioms' /tmp/axioms.txt | sed -E 's/.*\[(.*)\]/\1/' | tr ',' '\n' | tr -d ' ' | grep -v -E '^(propext|Classical\.choice|Quot\.sound)$' | grep -q .

      - name: Lean against Rust (the same decks run by Babbage.step and by src/sketch.rs)
        run: scripts/lean-diff.sh 2000
